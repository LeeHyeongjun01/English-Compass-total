name: Deploy Problem Service

on:
  push:
    branches: [main]
    paths:
      - 'ProblemService'
      - '.github/workflows/deploy-problem-service.yml'

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/english-compass-problem-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4
        with:
          repository: English-Compass/ProblemService
          ref: lhj
          token: ${{ secrets.GH_PAT }}
          path: ProblemService

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build with Gradle
        run: |
          cd ProblemService
          ./gradlew clean build -x test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./ProblemService
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to EC2 #2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_2_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:latest
            cd ~/app
            docker-compose up -d --no-deps --force-recreate problem-service-app
            docker image prune -f
