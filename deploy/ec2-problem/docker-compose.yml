services:
  problem-service-app:
    image: ghcr.io/leehyeongjun01/english-compass-problem-service:latest
    container_name: problem-service-app
    ports:
      - "8082:8080"
    environment:
      JAVA_OPTS: -Xms256m -Xmx512m -XX:+UseG1GC
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://${EC2_5_PRIVATE_IP}:3306/problem_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&connectionCollation=utf8mb4_unicode_ci
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      KAFKA_BOOTSTRAP_SERVERS: ${EC2_5_PRIVATE_IP}:9092
      REDIS_HOST: ${EC2_5_PRIVATE_IP}
      REDIS_PORT: 6379
      GEMINI_API_KEY_EN: ${GEMINI_API_KEY_EN}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
