services:
  user-service-app:
    image: ghcr.io/leehyeongjun01/english-compass-user-service:latest
    container_name: user-service-app
    ports:
      - "8081:8080"
    environment:
      JAVA_OPTS: -Xms256m -Xmx384m -XX:+UseG1GC
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://${EC2_5_PRIVATE_IP}:3306/user_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  speech-service:
    image: ghcr.io/leehyeongjun01/english-compass-speech-service:latest
    container_name: speech-service
    ports:
      - "8085:8080"
    environment:
      JAVA_OPTS: -Xms128m -Xmx256m -XX:+UseG1GC
      SPRING_PROFILES_ACTIVE: docker
      OPENAI_API_API_KEY: ${OPENAI_API_KEY}
      SPRING_REDIS_HOST: ${EC2_5_PRIVATE_IP}
      SPRING_REDIS_PORT: 6379
    restart: unless-stopped
    mem_limit: 384m
